<head>
    <style>
        body {
            background: var(--bg);
            margin: 0;
            padding: 0;
            text-align: center;
            color: var(--txtc);
            font-family: sans-serif;
        }
        body.dark {
            --bg: linear-gradient(to right, #1b1e1f, #191c1e, #181d21); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            --txtc: white;
            --txtatf: white;
            --navc: #101415;
        }
        body.light {
            --bg: linear-gradient(to right, #989a9a, #babcbc, #bfc2c2); /* Don't deserve good color's as the black website. W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            --txtc: black;
            --txtatf: white;
            --navc: #b4b0b0
        }
        /** End Styles for White **/
        p {
            font-size: 1.25rem;
        }
        #info-hero {
            color: var(--txtatf);
           margin: 15px; 
        }
        #herotxt {
            font-size: 2.75rem;
            line-height: 1;
            color: var(--txtatf);
        }
        .heroimg {
            position: sticky;
            background-image: url('./hero_img.jpg');
            background-repeat: no-repeat;
            background-position: 50% center;
            inset: 0;
            min-height: 500px;
            background-size: cover;
            padding-top: 0.15px;
        }
        .h1-style {
            color: var(--txtc);
            font-size: 1.5rem;
            line-height: 2rem
        }
        .socal-ele {
            transition: 0.4s ease;
            transform: scale(1);
        }
        .socal-ele:hover {
            transition: 0.4s ease;
            transform: scale(1.25);
        }
        html {
            scroll-behavior: smooth;
        }
        footer {
            margin-top: 15%;
            color: var(--txtc);
            background-color: var(--navc);
        }
        ::selection {
            background: rgba(255, 141, 35, 1);
            color: red;
        }
        .topnav {
            overflow: hidden;
            background-color: var(--navc);
        }
        .topnav a {
            font-weight: bold;
            padding: 15px;
            display: block;
            float: none; /** inital or left for desktop **/
        }

        .topnav a:not(:first-child) {display: none;}

        .topnav .icon {
            display: block;
        }
        .topnav a.icon {
            float: right;
            display: block;
            position: absolute;
            right: 0;
            top: 0;
        }
        .topnav.responsive a {
            display: block;
        }


        /** Styles for Desktop, as it is mobile 1st **/
        @media only screen and (min-width: 992px) {
            .topnav a {
            font-weight: bold;
            padding: 15px;
            display: inline;
            float: left; /** inital or left for desktop **/
        }

        .topnav a:not(:first-child) {
            display: inline;
        }

        .topnav a:hover {
            background-color: #0a1a1e;
        }
        .topnav .icon {
            display: none;
        }
        .topnav a.icon {
            display: none;
        }
            

        }
    </style>

<script async>
    var getyear = new Date().getFullYear();
    document.getElementById('datecp').innerHTML = getyear
   
    function CheckNavBar() {
        var navbar = document.getElementById('nav-bar')
        if (navbar.className === "topnav") {
           navbar.classList.add("responsive"); // adds resposive class
        } else {
            navbar.className = "topnav" // replaces it 
        }
    
    }
    function ChangeTheme() {
        var themeselector = document.body;
        if(themeselector.className === 'dark') 
        {
            themeselector.className = 'light'
        }
        else 
        {
            themeselector.className = 'dark'
        }
        var getclassname = themeselector.className;
        localStorage.getItem("theme");
        localStorage.setItem("theme", getclassname)
        console.log(localStorage.getItem("theme", getclassname))
    }

    if ('serviceWorker' in navigator) {
   navigator.serviceWorker.register("/sw.js");
}

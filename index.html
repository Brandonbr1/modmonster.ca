<!DOCTYPE html>

    <style>
        /** Basic styles setting inital stuff **/
        :root {
            --selection-color: red;
            --selection-color-bg: orange;
            --mob-p-font-size: 1.25rem;
            --mob-lihei1: 1;
            --mob-lihei2: 2rem;
            --mob-h1-size: 1.5rem;
        }
        body {
            background: var(--bg);
            margin: 0;
            padding: 0;
            text-align: center;
            color: var(--txtc);
            font-family: sans-serif;
        }
        p {
            font-size: var(--mob-p-font-size);
        }
        html {
            scroll-behavior: smooth;
        }
        ::selection {
            background: var(--selection-color-bg);
            color: var(--selection-color);
        }
        body.dark {
            --bg: linear-gradient(to right, #1b1e1f, #191c1e, #181d21); 
            --bg-hov: #0a1a1e;
            --txtatf: white;
            --navc: #101415;
            --txtc: white;
            --current-c: #373737;
        }
        body.light {
            --bg: linear-gradient(to right, #989a9a, #babcbc, #bfc2c2); 
            --bg-hov: #828a8a;
            --txtc: black;
            --txtatf: white;
            --navc: #b4b0b0;
            --current-c: #bbc0c0;
        }
         /** Basic styles setting inital stuff End**/


        /** Above the Fold Stuff **/
        
        #info-hero {
           color: var(--txtatf);
           margin: 15px; 
        }
        #herotxt {
            font-size: 2.75rem;
            line-height: var(--mob-lihei1);
            color: var(--txtatf);
        }
        .heroimg {
            position: sticky;
            background-image: url('./hero_img.jpg');
            background-repeat: no-repeat;
            background-position: 50% center;
            inset: 0;
            min-height: 500px;
            background-size: cover;
            padding-top: 0.15px;
        }
        /** Above the Fold Stuff End **/
        .themeswitcher {
            position: fixed;
            top: 50%;
            background-color: var(--current-c);
        }
        .h1-style {
            color: var(--txtc);
            font-size: var(--mob-h1-size);
            line-height: var(--mob-lihei2);
        }
        footer {
            margin-top: 15%;
            color: var(--txtc);
            background-color: var(--navc);
        }
        /** Navbar **/
        .topnav {
            overflow: hidden;
            background-color: var(--navc);
        }
        .topnav a {
            font-weight: bold;
            padding: 15px;
            display: block;
            float: none;
        }

        .topnav a.current {
            background-color: var(--current-c);
        }

        .topnav a:not(:first-child) {display: none;}

        .topnav .icon {
            display: block;
        }
        .topnav a.icon {
            float: right;
            display: block;
            position: absolute;
            right: 0;
            top: 0;
        }
        .topnav.extended a {
            display: block;
        }
        /** NavBar End **/

        /** Animation **/
        .hide-fade {
            opacity: 0.1;
            transition: all 1.5s;
        }
        .fade {
            opacity: 1;
            transition: all 1.5s;
        }
        .scale-hidden {
            transform: scale(2.25);
            filter: blur(4px);
            transition: all 0.95s;
        }
        .scale {
            transform: scale(1);
            filter: blur(0);
            transition: all 0.95s;
        }

        @media (prefers-reduced-motion) {
        .scale-hidden {
            transition: all 0.95s;
        }
        .hide-fade {
            transition: all 1.5s;
        }
}

        /** Styles for Desktop and laptops, as it is mobile first website **/
        @media only screen and (min-width: 700px) {
        .topnav a {
            padding: 15px;
            margin-left: 45px;
            display: inline-block;
            float: none; 
        }

        .topnav a:not(:first-child) {
            display: inline-block;
        }

        .topnav a:hover {
            background-color: var(--bg-hov);
        }
        .topnav .icon, .topnav a.icon {
            display: none;
        }
        .socal-ele {
            transition: 0.4s ease;
            transform: scale(1);
        }
        .socal-ele:hover {
            transition: 0.4s ease;
            transform: scale(1.25);
        }
        .heroimg {
            min-height: 600px;
        }
            
        }
    </style>

<script defer>
    var getyear = new Date().getFullYear();
    document.getElementById('datecp').innerHTML = getyear
   
    function CheckNavBar() {
        var navbar = document.getElementById('nav-bar')
        if (navbar.className === "topnav") {
           navbar.classList.add("extended"); // adds resposive class
        } else {
            navbar.className = "topnav" // replaces it 
        }
    
    }

    var themeselector = document.body;
    function ChangeTheme() {
        var getclassname = themeselector.className;
        if(themeselector.className === 'dark') 
        {
            themeselector.className = 'light'
        }
        else 
        {
            themeselector.className = 'dark'
        }
        
        localStorage.getItem("theme");
        localStorage.setItem("theme", getclassname)
        console.log(localStorage.getItem("theme", getclassname))
    }

    document.addEventListener("loadstart", () => {
        var getclassname = themeselector.className;
        if (localStorage.getItem('theme') === null || '' || "") {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) 
            {
                localStorage.getItem("theme");
                localStorage.setItem("theme", "dark")
            }
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) 
             {
                localStorage.setItem("theme", "light")
            } else 
            {
                localStorage.getItem("theme");
                localStorage.setItem("theme", 'light');
                themeselector.className = 'light';
            }
        } 
        if (localStorage.getItem('theme') === "dark") 
        {
            themeselector.className = 'light'
        } 
        if (localStorage.getItem('theme') === "light") 
        {
            themeselector.className = 'dark'
        }   
        
    })

    if ('serviceWorker' in navigator) {
   navigator.serviceWorker.register("sw.js");
}

const observer = new IntersectionObserver(enties => {
    enties.forEach(entry => {
        if (entry.isIntersecting) {
        entry.target.classList.add('scale')
        }
    });
});

const animationelements = document.querySelectorAll('.scale-hidden');
animationelements.forEach(el => observer.observe(el))



</script>
